server {
    server_name solucioncanina.es;
    return 301 https://www.solucioncanina.es$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/solucioncanina.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/solucioncanina.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.solucioncanina.es;
    root /var/www/solucioncanina/html;
    index index.html;

    access_log /var/log/solucioncanina/access.log;
    include /etc/nginx/snippets/solucioncanina-stats.conf;

    include /etc/nginx/snippets/solucioncanina-redirects.conf;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location ^~ /_astro/ { expires 1y; }
    location ^~ /fonts/  { expires 1y; }
    location ^~ /images/ { expires 30d; }
    location = /logo.png { expires 30d; }
    location = /apple-touch-icon.png { expires 30d; }
    location ^~ /icons/ { expires 30d; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        charset utf-8;
        expires 1d;
    }
    location = /robots.txt { expires 1d; }
    location ~* \.xml$ { expires 1h; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/solucioncanina.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/solucioncanina.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = solucioncanina.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name solucioncanina.es;
    return 404; # managed by Certbot


}

server {
    if ($host = www.solucioncanina.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.solucioncanina.es;
    return 404; # managed by Certbot


}

