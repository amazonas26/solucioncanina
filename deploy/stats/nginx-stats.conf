# Informe GoAccess. Fuera de root (/var/www/solucioncanina/html):
# el rsync --delete del deploy no puede borrar /var/www/stats/.
#
# Copiar a /etc/nginx/snippets/solucioncanina-stats.conf
# e incluirlo en el server { www.solucioncanina.es }.

location ^~ /stats/ {
    alias /var/www/stats/;
    index solucioncanina.html;
    auth_basic "Solución Canina stats";
    auth_basic_user_file /etc/nginx/htpasswd/solucioncanina-stats;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
